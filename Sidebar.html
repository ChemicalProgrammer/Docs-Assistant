<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Styles'); ?>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="title">Docs Assistant</div>
      <div class="subtitle">Format · Structure · Write with Gemini</div>
    </div>
    <button class="icon" onclick="openSettings()" title="Settings">⚙</button>
  </header>

  <div class="tabs">
    <button id="tabFormat" class="tab active" onclick="showTab('format')">Formatting</button>
    <button id="tabGemini" class="tab" onclick="showTab('gemini')">Gemini</button>
  </div>

  <main>
    <section id="formatPanel">
      <div class="context" id="selectionContext">Checking selection…</div>

      <div class="group">
        <label>TEXT STYLE</label>
        <button class="wide" onclick="styleText('NORMAL')">Normal text</button>
        <div class="grid2">
          <button onclick="styleText('H1')">Heading 1</button><button onclick="styleText('H2')">Heading 2</button>
          <button onclick="styleText('H3')">Heading 3</button><button onclick="styleText('H4')">Heading 4</button>
          <button onclick="styleText('H5')">Heading 5</button><button onclick="styleText('H6')">Heading 6</button>
        </div>
      </div>

      <div class="group">
        <label>LISTS</label>
        <div class="grid4">
          <button onclick="list('BULLET')">•</button>
          <button onclick="list('NUMBER')">1.</button>
          <button onclick="list('LETTER')">a)</button>
          <button onclick="list('ROMAN')">i.</button>
        </div>
        <label class="check"><input id="continueNumbering" type="checkbox"> Continue previous numbering</label>
      </div>

      <div class="group">
        <label>PARAGRAPH</label>
        <div class="grid2">
          <button onclick="spacing(6,6,1)">Space 6 / 6</button>
          <button onclick="spacing(0,0,1.5)">Line 1.5</button>
          <button onclick="spacing(0,0,2)">Double space</button>
          <button onclick="keepNext()">Keep with next</button>
        </div>
      </div>

      <div class="group">
        <label>BREAKS</label>
        <select id="breakKind">
          <option value="PAGE">Page break</option>
          <option value="SECTION_NEXT">Section break — next page</option>
          <option value="SECTION_CONTINUOUS">Section break — continuous</option>
        </select>
        <button class="wide" onclick="addBreak()">Insert break</button>
      </div>
    </section>

    <section id="geminiPanel" class="hidden">
      <div class="context" id="geminiContext">Checking document context…</div>

      <div class="group">
        <label>GEMINI ASSISTANT</label>
        <textarea id="rawText" placeholder="Paste text here, or leave empty to use the selected text…"></textarea>
        <textarea id="instruction" class="smallarea" placeholder="Custom instruction…"></textarea>
        <button class="primary wide" onclick="askGemini()">✨ Ask Gemini</button>
      </div>

      <div class="group">
        <label>QUICK ACTIONS</label>
        <div class="grid2">
          <button onclick="quick('TRANSLATE_EN')">Translate EN</button>
          <button onclick="quick('TRANSLATE_ES')">Translate ES</button>
          <button onclick="quick('SUMMARIZE_50')">Summarize 50%</button>
          <button onclick="quick('SUMMARIZE_75')">Summarize 75%</button>
          <button onclick="quick('EXPAND_125')">Expand 125%</button>
          <button onclick="quick('EXPAND_150')">Expand 150%</button>
          <button onclick="quick('TECHNICAL')">Make technical</button>
          <button onclick="quick('CONCISE')">Make concise</button>
        </div>
      </div>

      <div id="resultBox" class="group hidden">
        <label>PREVIEW</label>
        <textarea id="result" class="result"></textarea>
        <div class="grid2">
          <button id="replaceBtn" class="primary" onclick="applyResult('REPLACE')">Replace selection</button>
          <button onclick="applyResult('INSERT')">Insert at cursor</button>
        </div>
      </div>
    </section>

    <div id="status"></div>
  </main>
</div>

<?!= include('Scripts'); ?>
</body>
</html>
