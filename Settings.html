<!DOCTYPE html>
<html>
<head><base target="_top"><?!= include('Styles'); ?></head>
<body>
<div class="settings">
  <div class="settingsHeader">
    <div class="brandmark">✦</div>
    <div><h2>Settings</h2><div class="subtitle">Docs Assistant · Gemini configuration</div></div>
  </div>
  <div class="settingsCard">
    <div class="muted">Your Gemini API key is stored separately for your user account in Apps Script User Properties.</div>
    <label>GEMINI API KEY</label>
    <input id="apiKey" type="password" placeholder="Paste Gemini API key">
    <div id="currentKey" class="muted"></div>
    <div class="row">
      <button id="saveBtn" class="primary" onclick="save(event)">Save key</button>
      <button id="removeBtn" class="danger" onclick="removeKey(event)">Remove</button>
    </div>
    <div id="settingsStatus"></div>
  </div>
</div>
<script>
let busy=false;
function setBusy(btn,label){
 if(busy)return false; busy=true;
 document.querySelectorAll('button,input').forEach(x=>x.disabled=true);
 btn.dataset.old=btn.innerHTML;btn.classList.add('task-active');
 btn.innerHTML='<span class="task-spinner"></span>'+label;btn.disabled=false;return true;
}
function finish(btn,msg,ok=true){
 btn.classList.remove('task-active');btn.innerHTML=ok?'✓ Done':'! Error';
 btn.classList.add(ok?'task-success':'task-error');document.getElementById('settingsStatus').textContent=msg;
 setTimeout(()=>{btn.innerHTML=btn.dataset.old;btn.classList.remove('task-success','task-error');busy=false;document.querySelectorAll('button,input').forEach(x=>x.disabled=false);load()},650);
}
function load(){google.script.run.withSuccessHandler(v=>{document.getElementById('currentKey').textContent=v?'Current: '+v:'No API key configured.'}).getMaskedGeminiApiKey()}
function save(e){
 const btn=e.currentTarget,key=document.getElementById('apiKey').value;if(!setBusy(btn,'Saving…'))return;
 google.script.run.withSuccessHandler(()=>{document.getElementById('apiKey').value='';finish(btn,'API key saved.')}).withFailureHandler(x=>finish(btn,x.message,false)).saveGeminiApiKey(key);
}
function removeKey(e){
 const btn=e.currentTarget;if(!setBusy(btn,'Removing…'))return;
 google.script.run.withSuccessHandler(()=>finish(btn,'API key removed.')).withFailureHandler(x=>finish(btn,x.message,false)).deleteGeminiApiKey();
}
load();
</script>
</body></html>
