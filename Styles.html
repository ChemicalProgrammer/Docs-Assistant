<style>
:root{
  font-family:Google Sans,Roboto,Arial,sans-serif;
  color:#1f1f1f;background:#fff;
  --blue:#0b57d0;--blue2:#1a73e8;--surface:#f8fafd;--line:#e3e7ee;
  --text2:#5f6368;--shadow:0 8px 24px rgba(60,64,67,.10);
}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#fff 0,#fbfcff 100%)}
.app{padding:14px 14px 22px}.settings{padding:22px}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 13px}
.brand{display:flex;gap:10px;align-items:center}.brandmark{
 width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:17px;
 background:linear-gradient(135deg,#4285f4,#7c4dff 58%,#ea80fc);box-shadow:0 5px 14px rgba(66,133,244,.25)
}
.title{font-size:18px;font-weight:650;letter-spacing:-.2px}.subtitle{font-size:11px;color:var(--text2);margin-top:2px}
.icon{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:17px}
.icon:hover{background:#f1f3f4;transform:rotate(12deg)}
.tabs{display:flex;background:#f1f4f9;border-radius:14px;padding:4px;margin-bottom:14px}
.tab{flex:1;border:0;background:transparent;padding:9px;border-radius:11px;color:var(--text2);font-weight:600}
.tab.active{background:#fff;color:var(--blue);box-shadow:0 2px 7px rgba(60,64,67,.12)}
.group{margin:12px 0;padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(60,64,67,.035)}
.group>label{display:block;font-size:10px;color:#6b7280;font-weight:700;letter-spacing:.9px;margin-bottom:10px}
button,select,input,textarea{font:inherit;border:1px solid #dfe3ea;border-radius:11px;background:#fff;color:#303134;transition:all .18s cubic-bezier(.2,.8,.2,1)}
button{position:relative;padding:9px 10px;cursor:pointer;overflow:hidden;font-weight:520}
button:hover:not(:disabled){background:#f8fafd;border-color:#cbd5e1;transform:translateY(-1px);box-shadow:0 4px 10px rgba(60,64,67,.08)}
button:active:not(:disabled){transform:translateY(0) scale(.975);box-shadow:none}
button:disabled{cursor:not-allowed;opacity:.48}
.primary{background:linear-gradient(135deg,#0b57d0,#4f46e5);color:white;border:0;box-shadow:0 5px 13px rgba(11,87,208,.22)}
.primary:hover:not(:disabled){background:linear-gradient(135deg,#0b57d0,#4f46e5);box-shadow:0 7px 17px rgba(11,87,208,.28)}
.wide{width:100%;margin-bottom:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.check{font-size:12px!important;font-weight:400!important;letter-spacing:0!important;margin:11px 1px 0;display:flex!important;align-items:center;gap:7px}
.check input{width:auto;margin:0;accent-color:var(--blue)}
.context{padding:11px 12px;background:linear-gradient(135deg,#f5f8ff,#faf7ff);border:1px solid #e6e9f4;border-radius:14px;font-size:12px;color:var(--text2)}
textarea{width:100%;min-height:110px;padding:11px;resize:vertical;margin-bottom:8px;outline:none}
textarea:focus,input:focus,select:focus{border-color:#8ab4f8;box-shadow:0 0 0 3px rgba(138,180,248,.18)}
.smallarea{min-height:68px}.result{min-height:160px}
select,input{width:100%;padding:9px;margin-bottom:8px}.hidden{display:none!important}
#status,#settingsStatus{font-size:12px;margin-top:10px;color:var(--text2)}.row{display:flex;gap:8px;margin-top:10px}h2{margin-top:0}

/* Global task overlay */
#busyOverlay{position:fixed;inset:0;background:rgba(255,255,255,.68);backdrop-filter:blur(3px);z-index:999;display:flex;align-items:center;justify-content:center;animation:fadeIn .16s ease}
.busyCard{width:190px;padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);text-align:center}
.geminiSpinner{width:38px;height:38px;margin:0 auto 11px;border-radius:13px;background:linear-gradient(135deg,#4285f4,#7c4dff,#ea80fc);animation:pulseSpin 1.15s ease-in-out infinite}
.busyTitle{font-size:13px;font-weight:650}.busySub{font-size:11px;color:var(--text2);margin-top:4px}
.running{pointer-events:none}
.running::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.65) 50%,transparent 80%);transform:translateX(-120%);animation:shimmer 1s infinite}
.successFlash{animation:successPop .55s ease}
.errorFlash{animation:errorShake .35s ease}
@keyframes shimmer{to{transform:translateX(120%)}}
@keyframes pulseSpin{0%{transform:rotate(0) scale(.92);border-radius:13px}50%{transform:rotate(180deg) scale(1.08);border-radius:50%}100%{transform:rotate(360deg) scale(.92);border-radius:13px}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes successPop{0%{transform:scale(1)}45%{transform:scale(.96);box-shadow:0 0 0 4px rgba(52,168,83,.14)}100%{transform:scale(1)}}
@keyframes errorShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
