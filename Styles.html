<style>
:root{font-family:Arial,sans-serif;color:#202124;background:#fff}
*{box-sizing:border-box} body{margin:0}
.app{padding:14px}.settings{padding:20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.title{font-size:18px;font-weight:600}.subtitle,.muted{font-size:12px;color:#5f6368;margin-top:3px}
.icon{border:0;background:transparent;font-size:18px;cursor:pointer}
.tabs{display:flex;border-bottom:1px solid #dadce0;margin-bottom:14px}
.tab{flex:1;border:0;background:white;padding:10px;cursor:pointer;color:#5f6368}
.tab.active{color:#0b57d0;border-bottom:2px solid #0b57d0;font-weight:600}
.group{margin:18px 0}.group>label{display:block;font-size:11px;color:#5f6368;font-weight:700;letter-spacing:.6px;margin-bottom:8px}

h2{margin-top:0}
