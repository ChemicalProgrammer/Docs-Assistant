<style>
:root{font-family:Google Sans,Roboto,Arial,sans-serif;color:#202124;background:#fff;
--blue:#1a73e8;--green:#14956f;--orange:#e66a18;--purple:#7b4ce2;--line:#e4e7ec;--muted:#697386}
*{box-sizing:border-box}body{margin:0;background:#fff}.app{padding:14px 14px 24px}.settings{padding:22px}
header{display:flex;justify-content:space-between;align-items:center;padding:3px 2px 14px}
.brand{display:flex;align-items:center;gap:10px}.brandmark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:white;font-size:18px;background:linear-gradient(135deg,#4285f4,#7657e8 60%,#d85fd2);box-shadow:0 4px 12px rgba(66,133,244,.22)}
.title{font-size:18px;font-weight:700;letter-spacing:-.25px}.subtitle{font-size:11px;color:var(--muted);margin-top:2px}
.icon{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:17px}.icon:hover:not(:disabled){background:#f1f3f4}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:15px}
.tab{border:0;padding:10px;border-radius:11px;font-weight:700;color:#fff;opacity:.62;box-shadow:none}
#tabFormat{background:linear-gradient(135deg,#1967d2,#4285f4)}
#tabGemini{background:linear-gradient(135deg,#6546d7,#a142f4)}
.tab.active{opacity:1;transform:translateY(-1px);box-shadow:0 5px 12px rgba(60,64,67,.18)}
.group{margin:12px 0;padding:13px;background:#fff;border:1px solid var(--line);border-radius:14px}
.group>label{display:block;font-size:10px;color:#6b7280;font-weight:800;letter-spacing:.85px;margin-bottom:9px}
button,select,input,textarea{font:inherit;border:1px solid #dfe3ea;border-radius:10px;background:#fff;color:#303134;transition:transform .14s ease,box-shadow .14s ease,filter .14s ease,opacity .14s ease}
button{position:relative;padding:9px 10px;cursor:pointer;overflow:hidden;font-weight:600;font-size:11px;line-height:1.2}
button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.035);box-shadow:0 4px 9px rgba(60,64,67,.12)}
button:active:not(:disabled){transform:scale(.975)}button:disabled{cursor:not-allowed;opacity:.42}
.wide{width:100%;margin-bottom:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* Functional color families */
.btn-fullformat{background:linear-gradient(110deg,#0b57d0,#5b4fe9 48%,#a142f4 78%,#d965c8);border:0;color:white;padding:12px 10px;box-shadow:0 5px 14px rgba(91,79,233,.22)}
.smartFormatGroup{border-color:#ded8f8;background:linear-gradient(145deg,#ffffff,#fbf9ff)}
.btn-style{background:linear-gradient(135deg,#1967d2,#4285f4);border:0;color:white}
.btn-list{background:linear-gradient(135deg,#0f8b67,#22a77b);border:0;color:white}
.btn-space{background:linear-gradient(135deg,#d85b0b,#f28b3c);border:0;color:white}
.btn-figure{background:linear-gradient(135deg,#6d4acb,#a45be0);border:0;color:white}
.btn-tablecaption{background:linear-gradient(135deg,#087f8c,#19a7ae);border:0;color:white}
.btn-table{background:linear-gradient(135deg,#087f8c,#19a7ae);border:0;color:white}
.btn-break{background:linear-gradient(135deg,#c74632,#e86b56);border:0;color:white}
.btn-gemini{background:linear-gradient(120deg,#356ae6,#7048e8 55%,#a142f4);border:0;color:white}
.btn-translate{background:linear-gradient(135deg,#1677d2,#35a4e8);border:0;color:white}
.btn-summary{background:linear-gradient(135deg,#7048c8,#9b59dc);border:0;color:white}
.btn-expand{background:linear-gradient(135deg,#148565,#2aaa7e);border:0;color:white}
.btn-technical{background:linear-gradient(135deg,#d65f18,#ef8b3b);border:0;color:white}
.btn-apply{background:linear-gradient(135deg,#1967d2,#4f46e5);border:0;color:white}

.check{font-size:12px!important;font-weight:400!important;letter-spacing:0!important;margin:11px 1px 0;display:flex!important;align-items:center;gap:7px}.check input{width:auto;margin:0;accent-color:var(--green)}
.context{padding:11px 12px;background:linear-gradient(135deg,#f4f7ff,#faf7ff);border:1px solid #e4e8f4;border-radius:13px;font-size:12px;color:#5f6368;position:relative}
.context:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#34a853;margin-right:7px}
textarea{width:100%;min-height:110px;padding:11px;resize:vertical;margin-bottom:8px;outline:none}textarea:focus,input:focus,select:focus{border-color:#8ab4f8;box-shadow:0 0 0 3px rgba(138,180,248,.17)}
.smallarea{min-height:68px}.result{min-height:160px}select,input{width:100%;padding:9px;margin-bottom:8px}.hidden{display:none!important}
#status,#settingsStatus{font-size:12px;margin-top:10px;color:#5f6368}.row{display:flex;gap:8px;margin-top:10px}h2{margin-top:0}

/* Only the active button animates. No page overlay. */
.task-active{opacity:1!important;pointer-events:none}
.task-active:after{content:"";position:absolute;top:0;bottom:0;width:42%;left:-50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);animation:buttonSweep .85s linear infinite}
.task-spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.48);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:6px;animation:spin .7s linear infinite}
.task-success{animation:successPulse .48s ease}.task-error{animation:errorShake .34s ease}
@keyframes buttonSweep{to{left:115%}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes successPulse{45%{transform:scale(.97);box-shadow:0 0 0 4px rgba(52,168,83,.16)}}
@keyframes errorShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
@media(prefers-reduced-motion:reduce){*,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.btn-smart{background:linear-gradient(110deg,#185abc,#5b4fe9 48%,#a142f4 78%,#d965c8);border:0;color:white;padding:11px 10px;box-shadow:0 5px 13px rgba(91,79,233,.20)}
.smartHint{font-size:10.5px;line-height:1.4;color:#6b7280;margin:-1px 2px 11px}
.settings{min-height:100vh;background:linear-gradient(180deg,#fff,#fafbff)}
.settingsHeader{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.settingsHeader .brandmark{flex:0 0 auto}
.settingsCard{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;box-shadow:0 3px 12px rgba(60,64,67,.06)}
.settings h2{font-size:18px;margin:0}.settings label{display:block;font-size:10px;color:#6b7280;font-weight:800;letter-spacing:.85px;margin:14px 0 7px}
.settings .primary{background:linear-gradient(135deg,#1967d2,#4285f4);border:0;color:#fff;font-weight:700}
.settings .danger{background:linear-gradient(135deg,#c74632,#e86b56);border:0;color:#fff;font-weight:700}
.settings .row button{flex:1}
</style>
