<script>
let ctx = {};
let taskRunning = false;

function showTab(name){
  if(taskRunning) return;
  document.getElementById('formatPanel').classList.toggle('hidden', name !== 'format');
  document.getElementById('geminiPanel').classList.toggle('hidden', name !== 'gemini');
  document.getElementById('tabFormat').classList.toggle('active', name === 'format');
  document.getElementById('tabGemini').classList.toggle('active', name === 'gemini');
  refreshContext();
}
function status(msg){document.getElementById('status').textContent=msg||''}

function beginTask(button, label='Working…'){
  if(taskRunning) return false;
  taskRunning = true;
  document.querySelectorAll('button,select,input,textarea').forEach(x=>x.disabled=true);
  if(button){button.classList.add('running');button.dataset.wasRunning='1'}
  const o=document.createElement('div');o.id='busyOverlay';
  o.innerHTML=`<div class="busyCard"><div class="geminiSpinner"></div><div class="busyTitle">${label}</div><div class="busySub">Please wait</div></div>`;
  document.body.appendChild(o);
  return true;
}
function endTask(ok=true,msg='Done'){
  const running=document.querySelector('[data-was-running="1"]');
  document.getElementById('busyOverlay')?.remove();
  document.querySelectorAll('button,select,input,textarea').forEach(x=>x.disabled=false);
  if(running){
    running.classList.remove('running');running.removeAttribute('data-was-running');
    running.classList.add(ok?'successFlash':'errorFlash');
    setTimeout(()=>running.classList.remove('successFlash','errorFlash'),650);
  }
  taskRunning=false; status(msg); refreshContext();
}
function fail(e){endTask(false,e.message||String(e))}
function runServer(button,label,fn,args=[],success='Done'){
  if(!beginTask(button,label)) return;
  let runner=google.script.run.withSuccessHandler(()=>endTask(true,success)).withFailureHandler(fail);
  runner[fn](...args);
}
function refreshContext(){
  google.script.run.withSuccessHandler(c=>{
    ctx=c;
    const msg=c.hasSelection ? `Selection · ${c.wordCount} words` :
      (c.hasCursor ? 'Insertion point · no text selected' : 'Click in the document to establish context');
    document.getElementById('selectionContext').textContent=msg;
    document.getElementById('geminiContext').textContent=msg;
    if(!taskRunning) document.getElementById('replaceBtn').disabled=!c.hasSelection;
  }).getDocumentContext();
}
function styleText(s,e){runServer(e.currentTarget,'Applying style…','applyNamedStyle',[s],'Style applied')}
function spacing(b,a,l,e){runServer(e.currentTarget,'Formatting paragraph…','setParagraphSpacing',[b,a,l],'Spacing applied')}
function keepNext(e){runServer(e.currentTarget,'Applying paragraph rule…','setKeepWithNext',[true],'Keep with next applied')}
function list(t,e){const c=document.getElementById('continueNumbering').checked;runServer(e.currentTarget,'Building list…','applyListPreset',[t,c],'List applied')}
function addBreak(e){runServer(e.currentTarget,'Inserting break…','insertBreak',[document.getElementById('breakKind').value],'Break inserted')}
function askGemini(e){
  if(!beginTask(e.currentTarget,'Gemini is writing…'))return;
  google.script.run.withSuccessHandler(t=>{showResult(t);endTask(true,'Preview ready')}).withFailureHandler(fail)
    .processWithGemini(document.getElementById('instruction').value,document.getElementById('rawText').value);
}
function quick(a,e){
  if(!beginTask(e.currentTarget,'Gemini is processing…'))return;
  google.script.run.withSuccessHandler(t=>{showResult(t);endTask(true,'Preview ready')}).withFailureHandler(fail)
    .quickGeminiAction(a,document.getElementById('rawText').value);
}
function showResult(t){document.getElementById('result').value=t;document.getElementById('resultBox').classList.remove('hidden')}
function applyResult(mode,e){runServer(e.currentTarget,mode==='REPLACE'?'Replacing selection…':'Inserting content…','insertGeminiResult',[document.getElementById('result').value,mode],'Applied to document')}
function openSettings(){if(!taskRunning)google.script.run.showSettings()}
refreshContext();
</script>
