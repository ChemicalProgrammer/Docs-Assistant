<script>
let ctx={},taskRunning=false,activeButton=null,activeOriginal='';

function showTab(name){
 if(taskRunning)return;
 document.getElementById('formatPanel').classList.toggle('hidden',name!=='format');
 document.getElementById('geminiPanel').classList.toggle('hidden',name!=='gemini');
 document.getElementById('testPanel').classList.toggle('hidden',name!=='test');
 document.getElementById('tabFormat').classList.toggle('active',name==='format');
 document.getElementById('tabGemini').classList.toggle('active',name==='gemini');
 document.getElementById('tabTest').classList.toggle('active',name==='test');
 refreshContext();
}
function status(m){document.getElementById('status').textContent=m||''}
function lockOthers(active){
 document.querySelectorAll('button').forEach(b=>{if(b!==active)b.disabled=true});
 document.querySelectorAll('select,input,textarea').forEach(x=>x.disabled=true);
}
function unlockAll(){
 document.querySelectorAll('button,select,input,textarea').forEach(x=>x.disabled=false);
}
function beginTask(btn,label){
 if(taskRunning)return false;
 taskRunning=true;activeButton=btn;activeOriginal=btn.innerHTML;
 lockOthers(btn);btn.classList.add('task-active');
 btn.innerHTML='<span class="task-spinner"></span>'+label;
 return true;
}
function endTask(ok,msg,refresh=false){
 if(!activeButton)return;

 const b=activeButton;
 const original=activeOriginal;

 b.classList.remove('task-active');
 b.innerHTML=ok?'✓ Done':'! Error';
 b.classList.add(ok?'task-success':'task-error');
 status(msg||'');

 // Unlock immediately instead of intentionally holding the UI for 700 ms.
 taskRunning=false;
 activeButton=null;
 activeOriginal='';
 unlockAll();

 if(refresh)refreshContext();

 setTimeout(()=>{
   b.classList.remove('task-success','task-error');
   b.innerHTML=original;
 },180);
}
function fail(e){endTask(false,e.message||String(e))}
function runServer(btn,label,fn,args=[],success='Done'){
 if(!beginTask(btn,label))return;
 let r=google.script.run.withSuccessHandler(()=>endTask(true,success)).withFailureHandler(fail);
 r[fn](...args);
}
function runParagraphServer(btn,fn,args,success){
 if(!beginTask(btn,'Applying…'))return;
 let r=google.script.run
   .withSuccessHandler(result=>{
     result=result||{};
     const count=Number(result.paragraphs||0);
     const elapsed=Number(result.elapsedMs||0);
     endTask(
       true,
       success+
       (count?` · ${count} paragraph${count===1?'':'s'}`:'')+
       (elapsed?` · server ${elapsed} ms`:'')
     );
   })
   .withFailureHandler(fail);
 r[fn](...args);
}
function refreshContext(){
 google.script.run.withSuccessHandler(c=>{
  ctx=c;const msg=c.hasSelection?`Selected content · ${c.wordCount} words`:(c.hasCursor?'Insertion point · ready':'Click in the document to establish context');
  document.getElementById('selectionContext').textContent=msg;
  document.getElementById('geminiContext').textContent=msg;
  document.getElementById('testContext').textContent=msg;
  if(!taskRunning)document.getElementById('replaceBtn').disabled=!c.hasSelection;
 }).getDocumentContext();

}

function refreshCaptionNumberingSettings(){
 google.script.run.withSuccessHandler(s=>{
   if(!s)return;
   const table=s.table||{};
   const figure=s.figure||{};

   const tInput=document.getElementById('tableCounterStart');
   const fInput=document.getElementById('figureCounterStart');
   if(tInput && document.activeElement!==tInput)tInput.value=table.startAt||1;
   if(fInput && document.activeElement!==fInput)fInput.value=figure.startAt||1;

   const tState=document.getElementById('tableCounterState');
   const fState=document.getElementById('figureCounterState');
   if(tState)tState.textContent=table.anchorSet?`Anchor set · ${table.startAt||1}`:`Document start · ${table.startAt||1}`;
   if(fState)fState.textContent=figure.anchorSet?`Anchor set · ${figure.startAt||1}`:`Document start · ${figure.startAt||1}`;
 }).getCaptionNumberingSettings();
}
function styleText(s,e){
 if(!beginTask(e.currentTarget,'…'))return;

 const totalStarted=performance.now();

 google.script.run
   .withSuccessHandler(r=>{
     r=r||{};
     const count=r.paragraphs||1;
     const totalMs=Math.round(performance.now()-totalStarted);
     const serverMs=Number(r.elapsedMs||0);

     endTask(
       true,
       `Style applied · ${count} paragraph${count===1?'':'s'} · `+
       `server ${serverMs} ms · total ${totalMs} ms`
     );
   })
   .withFailureHandler(fail)
   .applyStyleToCurrentContext(s);
}
function runCurrentTestUi(e){
 const output=document.getElementById('testOutput');
 if(!beginTask(e.currentTarget,'Testing…'))return;

 output.value='Running test…';

 google.script.run
   .withSuccessHandler(result=>{
     result=result||{};
     output.value=JSON.stringify(result,null,2);
     endTask(result.ok!==false,result.message||'Test completed');
   })
   .withFailureHandler(error=>{
     const message=error&&error.message?error.message:String(error);
     output.value='ERROR\n'+message;
     fail(error);
   })
   .runCurrentTest();
}
function toggleIndentBy(){
 const mode=document.getElementById('indentSpecial').value;
 document.getElementById('indentByWrap').classList.toggle('hidden',mode==='NONE');
}

function loadIndentation(e){
 if(!beginTask(e.currentTarget,'Loading…'))return;

 google.script.run
   .withSuccessHandler(r=>{
     r=r||{};
     document.getElementById('indentLeft').value=
       Number.isFinite(Number(r.left))?r.left:0;
     document.getElementById('indentRight').value=
       Number.isFinite(Number(r.right))?r.right:0;
     document.getElementById('indentSpecial').value=r.special||'NONE';
     document.getElementById('indentBy').value=
       Number.isFinite(Number(r.by))?r.by:0;
     toggleIndentBy();
     endTask(true,'Indentation loaded');
   })
   .withFailureHandler(fail)
   .getCurrentIndentation();
}

function applyIndentationUi(e){
 const left=parseFloat(document.getElementById('indentLeft').value);
 const right=parseFloat(document.getElementById('indentRight').value);
 const special=document.getElementById('indentSpecial').value;
 const by=special==='NONE'?0:parseFloat(document.getElementById('indentBy').value);

 if(!Number.isFinite(left)||!Number.isFinite(right)||!Number.isFinite(by)){
   status('Enter valid indentation values.');
   return;
 }

 if(!beginTask(e.currentTarget,'Applying…'))return;

 google.script.run
   .withSuccessHandler(r=>{
     const count=r&&r.paragraphs?r.paragraphs:1;
     endTask(true,`Indentation applied · ${count} paragraph${count===1?'':'s'}`);
   })
   .withFailureHandler(fail)
   .applyIndentation(left,right,special,by);
}
function formatSelectedStyles(e) {
  if (
    !beginTask(
      e.currentTarget,
      'Formatting…'
    )
  ) {
    return;
  }

  const totalStarted = performance.now();

  google.script.run
    .withSuccessHandler(function (result) {
      result = result || {};

      const parts = [];

      if (result.headings) {
        parts.push(
          result.headings +
          ' heading' +
          (result.headings === 1 ? '' : 's')
        );
      }

      if (result.tables) {
        parts.push(
          result.tables +
          ' table' +
          (result.tables === 1 ? '' : 's')
        );
      }

      if (result.lists) {
        parts.push(
          result.lists +
          ' list item' +
          (result.lists === 1 ? '' : 's')
        );
      }

      const captions =
        Number(result.figures || 0) +
        Number(result.tableCaptions || 0);

      if (captions) {
        parts.push(
          captions +
          ' caption' +
          (captions === 1 ? '' : 's')
        );
      }

      if (result.notes) {
        parts.push(
          result.notes +
          ' note' +
          (result.notes === 1 ? '' : 's')
        );
      }

      if (result.equations) {
        parts.push(
          result.equations +
          ' equation' +
          (result.equations === 1 ? '' : 's')
        );
      }

      if (result.normal) {
        parts.push(
          result.normal +
          ' normal'
        );
      }

      if (result.blank) {
        parts.push(
          result.blank +
          ' blank'
        );
      }

      const totalMs = Math.round(
        performance.now() - totalStarted
      );

      const serverMs = Number(
        result.elapsedMs || 0
      );

      endTask(
        true,
        'Selection formatted · ' +
        parts.join(' · ') +
        ' · server ' +
        serverMs +
        ' ms · total ' +
        totalMs +
        ' ms',
        true
      );
    })
    .withFailureHandler(fail)
    .formatSelectedNamedStyles();
}
function spacing(b,a,l,e){runParagraphServer(e.currentTarget,'setParagraphSpacing',[b,a,l],'Spacing applied')}
function keepNext(e){runParagraphServer(e.currentTarget,'setKeepWithNext',[true],'Keep with next applied')}
function list(t,e){runServer(e.currentTarget,'…','applyListPreset',[t],'List applied')}
function formatNote(e){
 runServer(e.currentTarget,'…','formatNoteLine',[],'Note formatted');
}
function formatCaption(type,e){
 if(!beginTask(e.currentTarget,'Formatting…'))return;
 google.script.run
   .withSuccessHandler(r=>{
     r=r||{};
     const label=type==='figure'?'Figure':'Table';
     const following=r.followingCaptionsRenumbered||0;
     endTask(
       true,
       `${label} ${r.number||''} formatted · ${following} following renumbered`
     );
   })
   .withFailureHandler(fail)
   .formatCaptionLine(type);
}
function setCaptionAnchor(type,e){
 const input=document.getElementById(type==='table'?'tableCounterStart':'figureCounterStart');
 const start=parseInt(input.value,10);
 if(!Number.isFinite(start)||start<1){status('Start at must be 1 or greater.');return;}
 if(!beginTask(e.currentTarget,'Setting…'))return;
 google.script.run
   .withSuccessHandler(()=>{
     refreshCaptionNumberingSettings();
     endTask(true,(type==='table'?'Table':'Figure')+' counter anchor set');
   })
   .withFailureHandler(fail)
   .setCaptionCounterAnchor(type,start);
}
function clearCaptionAnchor(type,e){
 if(!beginTask(e.currentTarget,'…'))return;
 google.script.run
   .withSuccessHandler(()=>{
     refreshCaptionNumberingSettings();
     endTask(true,(type==='table'?'Table':'Figure')+' counter reset to document start');
   })
   .withFailureHandler(fail)
   .clearCaptionCounterAnchor(type);
}
function renumberCaptions(e){
 if(!beginTask(e.currentTarget,'Renumbering…'))return;
 google.script.run
   .withSuccessHandler(r=>{
     r=r||{};
     const parts=[];
     parts.push(`${r.tables||0} tables`);
     parts.push(`${r.figures||0} figures`);
     if(r.skippedBeforeAnchor)parts.push(`${r.skippedBeforeAnchor} before anchor unchanged`);
     if(r.elapsedMs)parts.push(`${r.elapsedMs} ms`);
     endTask(true,'Renumbered · '+parts.join(' · '));
   })
   .withFailureHandler(fail)
   .renumberAllCaptions();
}
function formatTable(e){
 if(!beginTask(e.currentTarget,'Formatting…'))return;
 google.script.run
   .withSuccessHandler(r=>{
     r=r||{};
     endTask(
       true,
       `Table formatted · first row pinned · ${r.cells||0} cells`
     );
   })
   .withFailureHandler(fail)
   .formatSelectedTable();
}
function formatEquation(e){
 if(!beginTask(e.currentTarget,'Formatting…'))return;
 google.script.run
   .withSuccessHandler(r=>{
     const n=r&&r.equationNumber?r.equationNumber:'';
     const following=r&&r.followingEquationsRenumbered?r.followingEquationsRenumbered:0;
     const action=r&&r.mode==='UPDATED'?'updated':'formatted';
     endTask(
       true,
       n?`Equation ${n} ${action} · ${following} following renumbered`:`Equation ${action}`,
       true
     );
   })
   .withFailureHandler(fail)
   .formatEquationLine();
}
function addBreak(e){runServer(e.currentTarget,'Inserting…','insertBreak',['PAGE'],'Page break inserted')}
function smartApply(e){
 const text=document.getElementById('rawText').value.trim();
 if(!text){status('Paste content first.');return;}
 runServer(e.currentTarget,'Structuring…','smartApplyGeminiContent',[text],'Content formatted and applied');
}
function askGemini(e){
 if(!beginTask(e.currentTarget,'Generating…'))return;
 google.script.run.withSuccessHandler(t=>{showResult(t);endTask(true,'Preview ready')}).withFailureHandler(fail)
 .processWithGemini(document.getElementById('instruction').value,document.getElementById('rawText').value);
}
function quick(a,e){
 if(!beginTask(e.currentTarget,'Processing…'))return;
 google.script.run.withSuccessHandler(t=>{showResult(t);endTask(true,'Preview ready')}).withFailureHandler(fail)
 .quickGeminiAction(a,document.getElementById('rawText').value);
}
function showResult(t){document.getElementById('result').value=t;document.getElementById('resultBox').classList.remove('hidden')}
function applyResult(mode,e){runServer(e.currentTarget,mode==='REPLACE'?'Replacing…':'Inserting…','insertGeminiResult',[document.getElementById('result').value,mode],'Applied to document')}
function openSettings(){if(!taskRunning)google.script.run.showSettings()}
refreshContext();
refreshCaptionNumberingSettings();
toggleIndentBy();
</script>
